<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splat Tour</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaf0; --accent:#4cc38a; --panel:#181b22; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; overflow:hidden; }
  #panel { position:fixed; top:12px; left:12px; right:12px; max-width:340px; background:var(--panel); border-radius:10px; padding:12px; z-index:5; box-shadow:0 4px 18px #0008; }
  #panel h1 { font-size:15px; margin:0 0 8px; }
  button { background:var(--accent); color:#06140d; border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; margin-right:6px; }
  button.off { background:#2a2f3a; color:var(--fg); }
  #readout { margin-top:8px; min-height:1.4em; }
  #hint { color:#9aa3b5; margin-top:6px; font-size:12px; }
  input { width:70px; background:#0f1115; color:var(--fg); border:1px solid #333a48; border-radius:5px; padding:5px; }
  .dot { position:fixed; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--accent); border:2px solid #fff; pointer-events:none; z-index:4; }
  #err { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="panel">
  <h1>Splat Tour</h1>
  <button id="measure" class="off">Measure</button>
  <button id="reset" class="off">Clear</button>
  <div id="readout">Orbit with drag, zoom with wheel. Arrows/WASD walk, Q/E down/up, Shift = fast.</div>
  <div id="hint">Units are scene units until calibrated. Measure something you know (a door, 2.03 m), enter its real length, press Calibrate.</div>
  <div style="margin-top:8px">
    <input id="known" type="number" step="0.01" placeholder="metres"> <button id="calibrate" class="off">Calibrate</button>
  </div>
</div>
<div id="err">Add <code>?src=scene.ply</code> (or .splat / .ksplat / .spz) to the URL.</div>

<script type="module">
import * as THREE from 'three';
import * as GS from '@mkkellogg/gaussian-splats-3d';

const params = new URLSearchParams(location.search);
const src = params.get('src') || 'scene.ply';
let scale = parseFloat(localStorage.getItem('scale:' + src)) || 1;

const viewer = new GS.Viewer({
  cameraUp: [0, -1, 0],            // nerfstudio exports are Y-down; flip for a natural view
  initialCameraPosition: [0, -1, 3],
  initialCameraLookAt: [0, 0, 0],
  sharedMemoryForWorkers: false,   // avoids needing COOP/COEP headers on static hosts
});

try {
  await viewer.addSplatScene(src, { progressiveLoad: true });
  viewer.start();
} catch (e) {
  console.error(e);
  document.getElementById('err').style.display = 'grid';
}

// ---- keyboard movement -----------------------------------------------------
// Arrows / WASD: walk forward, back, strafe. Q/E: down/up. Shift: faster.
// Moves camera and orbit target together so orbiting still works afterwards.
const keys = new Set();
const typing = () => /input|textarea/i.test(document.activeElement?.tagName || '');
addEventListener('keydown', e => {
  if (typing()) return;
  const k = e.key.toLowerCase();
  if (k.startsWith('arrow') || 'wasdqe'.includes(k)) { keys.add(k); e.preventDefault(); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

const up = new THREE.Vector3(0, -1, 0);   // matches cameraUp above
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3();
let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (keys.size && viewer.camera && viewer.controls) {
    const speed = (keys.has('shift') ? 3 : 1) * 1.2 * dt;   // scene units / second
    viewer.camera.getWorldDirection(fwd);
    fwd.addScaledVector(up, -fwd.dot(up)).normalize();       // flatten to the floor plane
    right.crossVectors(fwd, up).normalize();
    move.set(0, 0, 0);
    const has = (...n) => n.some(x => keys.has(x));
    if (has('arrowup', 'w')) move.add(fwd);
    if (has('arrowdown', 's')) move.sub(fwd);
    if (has('arrowright', 'd')) move.sub(right);
    if (has('arrowleft', 'a')) move.add(right);
    if (has('e')) move.sub(up);
    if (has('q')) move.add(up);
    if (move.lengthSq()) {
      move.normalize().multiplyScalar(speed);
      viewer.camera.position.add(move);
      viewer.controls.target.add(move);
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- measuring -------------------------------------------------------------
const readout = document.getElementById('readout');
const measureBtn = document.getElementById('measure');
let measuring = false;
let points = [];   // world-space THREE.Vector3
let dots = [];     // DOM markers

const fmt = d => scale === 1 ? `${d.toFixed(3)} units` : `${(d * scale).toFixed(2)} m (${(d * scale * 3.28084).toFixed(1)} ft)`;

function clearAll() {
  points = []; dots.forEach(d => d.el.remove()); dots = [];
  readout.textContent = measuring ? 'Click two points.' : 'Orbit with drag, zoom with wheel.';
}

function updateDots() {
  const cam = viewer.camera, w = innerWidth, h = innerHeight;
  dots.forEach(d => {
    const p = d.world.clone().project(cam);
    const hidden = p.z > 1;
    d.el.style.display = hidden ? 'none' : 'block';
    d.el.style.left = ((p.x + 1) / 2 * w) + 'px';
    d.el.style.top = ((1 - p.y) / 2 * h) + 'px';
  });
  requestAnimationFrame(updateDots);
}
requestAnimationFrame(updateDots);

function pick(ev) {
  const rect = viewer.renderer.domElement.getBoundingClientRect();
  const mouse = new THREE.Vector2(ev.clientX - rect.left, ev.clientY - rect.top);
  const dims = new THREE.Vector2(rect.width, rect.height);
  viewer.raycaster.setFromCameraAndScreenPosition(viewer.camera, mouse, dims);
  const hits = viewer.raycaster.intersectSplatMesh(viewer.splatMesh);
  return hits.length ? hits[0].origin.clone() : null;
}

// Distinguish click from orbit-drag.
let down = null;
addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
addEventListener('pointerup', e => {
  if (!measuring || !down || e.target.closest('#panel')) return;
  if (Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 4) return;
  const hit = pick(e);
  if (!hit) { readout.textContent = 'No surface under cursor, try again.'; return; }
  if (points.length >= 2) clearAll();
  points.push(hit);
  const el = Object.assign(document.createElement('div'), { className: 'dot' });
  document.body.appendChild(el);
  dots.push({ el, world: hit });
  readout.textContent = points.length === 1 ? 'Click the second point.' : fmt(points[0].distanceTo(points[1]));
});

measureBtn.onclick = () => {
  measuring = !measuring;
  measureBtn.classList.toggle('off', !measuring);
  measureBtn.textContent = measuring ? 'Measuring…' : 'Measure';
  clearAll();
};
document.getElementById('reset').onclick = clearAll;

document.getElementById('calibrate').onclick = () => {
  const known = parseFloat(document.getElementById('known').value);
  if (points.length !== 2 || !(known > 0)) { readout.textContent = 'Pick two points, then enter a length in metres.'; return; }
  scale = known / points[0].distanceTo(points[1]);
  try { localStorage.setItem('scale:' + src, scale); } catch {}
  readout.textContent = `Calibrated. ${fmt(points[0].distanceTo(points[1]))}`;
};
</script>
</body>
</html>
