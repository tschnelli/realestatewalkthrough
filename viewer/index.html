<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Splat Tour</title>
<style>
  :root { --bg:#0f1115; --fg:#e8eaf0; --accent:#4cc38a; --panel:#181b22; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui,sans-serif; overflow:hidden; }
  #panel { position:fixed; top:12px; left:12px; right:12px; max-width:340px; background:var(--panel); border-radius:10px; padding:12px; z-index:5; box-shadow:0 4px 18px #0008; }
  #panel h1 { font-size:15px; margin:0 0 8px; }
  button { background:var(--accent); color:#06140d; border:0; border-radius:6px; padding:7px 12px; font-weight:600; cursor:pointer; margin-right:6px; }
  button.off { background:#2a2f3a; color:var(--fg); }
  #readout { margin-top:8px; min-height:1.4em; }
  #hint { color:#9aa3b5; margin-top:6px; font-size:12px; }
  input { width:70px; background:#0f1115; color:var(--fg); border:1px solid #333a48; border-radius:5px; padding:5px; }
  .dot { position:fixed; width:10px; height:10px; margin:-5px 0 0 -5px; border-radius:50%; background:var(--accent); border:2px solid #fff; pointer-events:none; z-index:4; }
  #cross { position:fixed; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; display:none; pointer-events:none; z-index:4;
           background:linear-gradient(#fff,#fff) center/2px 100% no-repeat, linear-gradient(#fff,#fff) center/100% 2px no-repeat; mix-blend-mode:difference; }
  #err { position:fixed; inset:0; display:none; place-items:center; text-align:center; padding:24px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.6/build/gaussian-splats-3d.module.js"
} }
</script>
</head>
<body>
<div id="panel">
  <h1>Splat Tour</h1>
  <button id="measure" class="off">Measure</button>
  <button id="reset" class="off">Clear</button>
  <div id="readout"></div>
  <div id="hint">Units are scene units until calibrated. Measure something you know (a door, 2.03 m), enter its real length, press Calibrate.</div>
  <div style="margin-top:8px">
    <input id="known" type="number" step="0.01" placeholder="metres"> <button id="calibrate" class="off">Calibrate</button>
  </div>
</div>
<div id="cross"></div>
<div id="err">Add <code>?src=scene.ply</code> (or .splat / .ksplat / .spz) to the URL.</div>

<script type="module">
import * as THREE from 'three';
import * as GS from '@mkkellogg/gaussian-splats-3d';

const params = new URLSearchParams(location.search);
const src = params.get('src') || 'scene.ply';
let scale = parseFloat(localStorage.getItem('scale:' + src)) || 1;

const viewer = new GS.Viewer({
  cameraUp: [0, -1, 0],            // nerfstudio exports are Y-down; flip for a natural view
  initialCameraPosition: [0, -1, 3],
  initialCameraLookAt: [0, 0, 0],
  sharedMemoryForWorkers: false,   // avoids needing COOP/COEP headers on static hosts
});

try {
  await viewer.addSplatScene(src, { progressiveLoad: true });
  viewer.start();
} catch (e) {
  console.error(e);
  document.getElementById('err').style.display = 'grid';
}

// ---- first-person controls -------------------------------------------------
// Click the scene to capture the mouse (Esc releases it). Mouse looks, arrows/WASD walk,
// Q/E down/up, Shift = fast, M toggles measuring, Backspace clears points.
const up = new THREE.Vector3(0, -1, 0);   // matches cameraUp above
const canvas = viewer.renderer.domElement;
const keys = new Set();
const typing = () => /input|textarea/i.test(document.activeElement?.tagName || '');
const locked = () => document.pointerLockElement === canvas;
let yaw = 0, pitch = 0;
const F0 = new THREE.Vector3(), R0 = new THREE.Vector3();
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), move = new THREE.Vector3(), dir = new THREE.Vector3();
let ready = false;

function initLook() {   // take the starting heading from wherever the camera currently points
  viewer.camera.getWorldDirection(dir);
  pitch = Math.asin(THREE.MathUtils.clamp(dir.dot(up), -1, 1));
  F0.copy(dir).addScaledVector(up, -dir.dot(up));
  if (F0.lengthSq() < 1e-6) F0.set(0, 0, -1);
  F0.normalize();
  R0.crossVectors(F0, up).normalize();
  yaw = 0; ready = true;
  viewer.controls.enabled = false;   // orbit controls off: the mouse is a first-person look now
}

canvas.addEventListener('click', () => { if (!locked()) { if (!ready) initLook(); canvas.requestPointerLock(); } });
document.addEventListener('pointerlockchange', () => {
  document.getElementById('cross').style.display = locked() ? 'block' : 'none';
});
document.addEventListener('mousemove', e => {
  if (!locked()) return;
  yaw += e.movementX * 0.002;
  pitch = THREE.MathUtils.clamp(pitch - e.movementY * 0.002, -1.45, 1.45);
});

addEventListener('keydown', e => {
  if (typing()) return;
  const k = e.key.toLowerCase();
  if (k === 'm') { toggleMeasure(); return; }
  if (k === 'backspace') { clearAll(); return; }
  if (k.startsWith('arrow') || 'wasdqe'.includes(k) || k === 'shift') { keys.add(k); if (k !== 'shift') e.preventDefault(); }
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));
addEventListener('blur', () => keys.clear());

let last = performance.now();
function tick(now) {
  const dt = Math.min((now - last) / 1000, 0.1); last = now;
  if (ready && viewer.camera && viewer.controls) {
    fwd.copy(F0).multiplyScalar(Math.cos(yaw)).addScaledVector(R0, Math.sin(yaw));   // heading on the floor plane
    right.crossVectors(fwd, up).normalize();
    const has = (...n) => n.some(x => keys.has(x));
    move.set(0, 0, 0);
    if (has('arrowup', 'w')) move.add(fwd);
    if (has('arrowdown', 's')) move.sub(fwd);
    if (has('arrowright', 'd')) move.add(right);
    if (has('arrowleft', 'a')) move.sub(right);
    if (has('e')) move.sub(up);
    if (has('q')) move.add(up);
    if (move.lengthSq()) viewer.camera.position.addScaledVector(move.normalize(), (keys.has('shift') ? 3 : 1) * 1.2 * dt);
    dir.copy(fwd).multiplyScalar(Math.cos(pitch)).addScaledVector(up, Math.sin(pitch));
    viewer.controls.target.copy(viewer.camera.position).add(dir);   // keep the (disabled) orbit controls from fighting us
    viewer.camera.lookAt(viewer.controls.target);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// ---- measuring -------------------------------------------------------------
const HELP = 'Click the scene to look around. Mouse = look, arrows/WASD = walk, Q/E = down/up, Shift = fast, M = measure, Esc = release mouse.';
const readout = document.getElementById('readout');
readout.textContent = HELP;
const measureBtn = document.getElementById('measure');
let measuring = false;
let points = [];   // world-space THREE.Vector3
let dots = [];     // DOM markers

const fmt = d => scale === 1 ? `${d.toFixed(3)} units` : `${(d * scale).toFixed(2)} m (${(d * scale * 3.28084).toFixed(1)} ft)`;

function clearAll() {
  points = []; dots.forEach(d => d.el.remove()); dots = [];
  readout.textContent = measuring ? 'Aim the crosshair and click two points.' : HELP;
}

function updateDots() {
  const cam = viewer.camera, w = innerWidth, h = innerHeight;
  dots.forEach(d => {
    const p = d.world.clone().project(cam);
    const hidden = p.z > 1;
    d.el.style.display = hidden ? 'none' : 'block';
    d.el.style.left = ((p.x + 1) / 2 * w) + 'px';
    d.el.style.top = ((1 - p.y) / 2 * h) + 'px';
  });
  requestAnimationFrame(updateDots);
}
requestAnimationFrame(updateDots);

function pick() {   // surface under the crosshair (screen centre)
  const rect = canvas.getBoundingClientRect();
  const mouse = new THREE.Vector2(rect.width / 2, rect.height / 2);
  const dims = new THREE.Vector2(rect.width, rect.height);
  viewer.raycaster.setFromCameraAndScreenPosition(viewer.camera, mouse, dims);
  const hits = viewer.raycaster.intersectSplatMesh(viewer.splatMesh);
  return hits.length ? hits[0].origin.clone() : null;
}

canvas.addEventListener('click', () => {
  if (!measuring || !locked()) return;
  const hit = pick();
  if (!hit) { readout.textContent = 'No surface under the crosshair, try again.'; return; }
  if (points.length >= 2) clearAll();
  points.push(hit);
  const el = Object.assign(document.createElement('div'), { className: 'dot' });
  document.body.appendChild(el);
  dots.push({ el, world: hit });
  readout.textContent = points.length === 1 ? 'Aim at the second point and click.' : fmt(points[0].distanceTo(points[1]));
});

function toggleMeasure() {
  measuring = !measuring;
  measureBtn.classList.toggle('off', !measuring);
  measureBtn.textContent = measuring ? 'Measuring…' : 'Measure';
  clearAll();
}
measureBtn.onclick = toggleMeasure;
document.getElementById('reset').onclick = clearAll;

document.getElementById('calibrate').onclick = () => {
  const known = parseFloat(document.getElementById('known').value);
  if (points.length !== 2 || !(known > 0)) { readout.textContent = 'Pick two points, then enter a length in metres.'; return; }
  scale = known / points[0].distanceTo(points[1]);
  try { localStorage.setItem('scale:' + src, scale); } catch {}
  readout.textContent = `Calibrated. ${fmt(points[0].distanceTo(points[1]))}`;
};
</script>
</body>
</html>
